name: Weekly Full Inventory Sweep

# Run Sundays 03:00 UTC (off-peak Santiago time).
# Pulls the complete inventory from each working source rather than just the
# daily "fresh" top-N sample. End-of-sweep active re-check verifies missing
# listings via 404/410.
on:
  schedule:
    - cron: '0 3 * * 0'  # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: 'comma-separated slugs, or "all"'
        default: 'all'
        type: string

concurrency:
  group: full-sweep
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.set.outputs.sources }}
    steps:
      - id: set
        shell: bash
        run: |
          input="${{ github.event.inputs.sources }}"
          if [ -z "$input" ] || [ "$input" = "all" ]; then
            # Only the working sources; the blocked 3 are skipped here.
            echo 'sources=["yapo","chileautos","autocosmos","autopia","auto_cl","autosusados"]' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s' "$input" | python3 -c 'import json,sys; xs=[x.strip() for x in sys.stdin.read().split(",") if x.strip()]; print(json.dumps(xs))')
            echo "sources=$json" >> "$GITHUB_OUTPUT"
          fi

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h 50m — under the 6h GH Actions job cap
    strategy:
      fail-fast: false
      max-parallel: 3  # spread across IP, friendlier to sources
      matrix:
        source: ${{ fromJson(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run full-inventory ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_MODE: 'full'
        run: python ingest.py --source ${{ matrix.source }} --timeout 18000

      - name: Upload raw JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.source }}-${{ github.run_id }}
          path: data/${{ matrix.source }}.json
          retention-days: 14
          if-no-files-found: warn

  finalize:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Heavy active re-check + market_stats refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STALE_DAYS: '5'        # tighter window — full sweep just touched everything live
          RECHECK_LIMIT: '5000'  # 10× the daily cap; weekly is the deep verify
          RECHECK_DELAY: '0.3'
        run: |
          python finalize.py
          python rollup.py
